<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Comparison</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 95vh;
            width: 100%;
        }
        .file-input-container {
            margin-bottom: 15px;
        }
        .legend {
            background-color: white;
            padding: 6px;
            line-height: 18px;
            color: #333;
            opacity: 0.9;
            display: block;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
        .legend .circle {
            border-radius: 50%; /* Make the shape round */
        }
        .legend .line {
            display: inline-block;
            width: 20px;
            height: 5px;
            background-color: #33ff57;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="file-input-container">
    <label for="geojsonFile1">Choose the Vetro address file:</label>
    <input type="file" id="geojsonFile1" accept=".geojson" />
    <label for="geojsonFile2">Choose the LLD address file:</label>
    <input type="file" id="geojsonFile2" accept=".geojson" />
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map', {
        maxBounds: L.latLngBounds(L.latLng(-90, -180), L.latLng(90, 180)), // Ensure scroll wheel zoom is enabled
        minZoom: 2, // Adjust the zoom delta to control how much zoom changes per scroll event
    }).setView([0, 0], 2); // Start with world view

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '@ Developed by JGN',
        maxZoom: 99,
    }).addTo(map);

    let firstGeojsonData;
    let secondGeojsonData;

    document.getElementById('geojsonFile1').addEventListener('change', function() {
        handleFirstGeoJSONUpload(this);
    });

    document.getElementById('geojsonFile2').addEventListener('change', function() {
        handleSecondGeoJSONUpload(this);
    });

    function getPopupContent(feature, titleField) {
        const lat = feature.geometry.coordinates[1].toFixed(6);
        const lng = feature.geometry.coordinates[0].toFixed(6);
        return `
            <strong>${titleField}</strong><br>
            ${feature.properties['House Number'] || feature.properties['Address'] || 'N/A'}<br>
            <strong>Coordinates:</strong><br>
            ${lat}, ${lng}
        `;
    }

    function drawPoints(features, color, radius, title, groupLayer) {
        const layer = L.geoJSON({
            type: "FeatureCollection",
            features: features
        }, {
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
                radius: radius,
                fillColor: color,
                color: color,
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            }).bindPopup(getPopupContent(feature, title))
        });

        layer.addTo(groupLayer);

        // Zoom to the bounds of the newly added layer (if any points are drawn)
        map.fitBounds(layer.getBounds(), { maxZoom: 15 });
          
    }

    function updateMapWithComparison(firstGeojsonData, secondGeojsonData) {
        let allPointsLayerGroup = L.layerGroup();

        const feetToMeters = 0.3048;
        const radiusInMeters = 1 * feetToMeters;

        let matchedFeatures = [];
        let unmatchedFirstFeatures = [];
        let unmatchedSecondFeatures = [];

        // Match first with second
        firstGeojsonData.features.forEach(function(firstFeature) {
            const firstLatLng = L.latLng(
                firstFeature.geometry.coordinates[1],
                firstFeature.geometry.coordinates[0]
            );

            let matchFound = false;
            secondGeojsonData.features.forEach(function(secondFeature) {
                const secondLatLng = L.latLng(
                    secondFeature.geometry.coordinates[1],
                    secondFeature.geometry.coordinates[0]
                );

                if (firstLatLng.distanceTo(secondLatLng) <= radiusInMeters) {
                    matchFound = true;
                }
            });

            if (matchFound) {
                matchedFeatures.push(firstFeature);
            } else {
                unmatchedFirstFeatures.push(firstFeature);
            }
        });

        // Match second with first
        secondGeojsonData.features.forEach(function(secondFeature) {
            const secondLatLng = L.latLng(
                secondFeature.geometry.coordinates[1],
                secondFeature.geometry.coordinates[0]
            );

            let matchFound = false;
            firstGeojsonData.features.forEach(function(firstFeature) {
                const firstLatLng = L.latLng(
                    firstFeature.geometry.coordinates[1],
                    firstFeature.geometry.coordinates[0]
                );

                if (secondLatLng.distanceTo(firstLatLng) <= radiusInMeters) {
                    matchFound = true;
                }
            });

            if (!matchFound) {
                unmatchedSecondFeatures.push(secondFeature);
            }
        });

        // Draw layers
        drawPoints(matchedFeatures, "#33ff57", 5, "Matched Address:", allPointsLayerGroup);
        drawPoints(unmatchedFirstFeatures, "#ff0000", 7, "Vetro Address:", allPointsLayerGroup);
        drawPoints(unmatchedSecondFeatures, "#3388ff", 5, "LLD Address:", allPointsLayerGroup);

        // Add to map
        allPointsLayerGroup.addTo(map);

       
    }

    function handleFirstGeoJSONUpload(inputElement) {
        const file = inputElement.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            firstGeojsonData = JSON.parse(e.target.result);

            if (secondGeojsonData) {
                updateMapWithComparison(firstGeojsonData, secondGeojsonData);
            }
        };

        reader.readAsText(file);
    }

    function handleSecondGeoJSONUpload(inputElement) {
        const file = inputElement.files[0];
        const reader = new FileReader();

        reader.onload = function(e) {
            secondGeojsonData = JSON.parse(e.target.result);

            if (firstGeojsonData) {
                updateMapWithComparison(firstGeojsonData, secondGeojsonData);
            }
        };

        reader.readAsText(file);
    }

    // Add legend to the map
    var legend = L.control({ position: 'topright' });

    legend.onAdd = function(map) {
        var div = L.DomUtil.create('div', 'legend');
        div.innerHTML += '<i class="circle" style="background: #3388ff"></i> Vetro address<p>';
        div.innerHTML += '<i class="circle" style="background: #ff5733"></i> LLD address<p>';
        
        return div;
    };

    legend.addTo(map);
</script>

</body>
</html>
